<Sec><H t="Construction Monitoring Is Still Mostly Reactive" tag="Existing evidence"/>
<div className="grid sm:grid-cols-2 lg:grid-cols-4 gap-5">{[['camera','CCTV','Records footage, but humans still need to monitor it.'],['activity','Sensors','Measure PM2.5 and PM10, but do not automatically explain why a spike occurred.'],['eye','Manual inspections','Cannot monitor every part of a construction site 24/7.'],['wind','Fixed-schedule water spraying','Can waste water, labour and time while still missing high-risk periods.']].map(([ic,t,d],i)=><R key={t} d={i*80}><div className="cd rounded-xl p-6 h-full"><div className="text-xs mut mb-3">Today</div><I n={ic} c="text-amber" s={26}/><h3 className="font-display font-bold text-lg mt-3">{t}</h3><p className="mut text-sm mt-2">{d}</p></div></R>)}</div>
<R c="mt-8"><p className="font-display text-2xl sm:text-3xl font-bold max-w-3xl leading-snug">The missing capability is not more monitoring. <span className="text-teal">It is knowing when, where and why a violation is likely to occur early enough to prevent it.</span></p></R></Sec>

<Sec dark c="!pb-16"><H dark t="Two Connected Intelligence Layers" tag="Product concept"/>
<div className="grid lg:grid-cols-2 gap-6">
<R><div className="rounded-2xl border border-white/15 bg-white/5 p-6 h-full"><div className="flex justify-between items-start gap-3"><h3 className="font-display font-bold text-2xl">Layer 1 · Prevention</h3><Tag dark>Up to approximately 18 hours ahead</Tag></div>
<p className="text-white/70 mt-3">The system combines planned construction activities, forecast weather, site conditions and existing dust controls to estimate when dust risk will be highest.</p>
<div className="mt-5 rounded-lg bg-navy p-4"><div className="flex justify-between text-xs text-white/60 mb-2"><span>Risk forecast</span><span>Illustrative Product Concept</span></div>
<div className="flex items-end gap-1.5 h-28" role="img" aria-label="Illustrative risk forecast bars across a day">{HRS.map((v,i)=><div key={i} className="flex-1 rounded-t" style={{height:v+'%',background:v>75?'#D9534F':v>50?'#E8A23A':'#5ED6BD'}}/>)}</div>
<div className="flex justify-between text-[11px] text-white/50 mt-1"><span>Now</span><span>+9h</span><span>+18h</span></div></div>
<p className="text-sm font-semibold mt-5">Possible recommendations</p>
<ul className="mt-2 grid sm:grid-cols-2 gap-x-4 gap-y-1.5 text-sm text-white/80">{['Reschedule a high-risk activity','Increase watering','Cover stockpiles','Strengthen site enclosure','Improve truck covering','Increase gate and wheel-control measures'].map(x=><li key={x} className="flex gap-2"><I n="check" c="text-mint shrink-0 mt-0.5" s={16}/>{x}</li>)}</ul></div></R>
<R d={100}><div className="rounded-2xl border border-white/15 bg-white/5 p-6 h-full"><div className="flex justify-between items-start gap-3"><h3 className="font-display font-bold text-2xl">Layer 2 · Detection</h3><Tag dark>Real-Time Monitoring</Tag></div>
<p className="text-white/70 mt-3">If preventive controls fail, PM2.5/PM10 sensors identify unusual dust levels while cameras check whether required controls are in place.</p>
<div className="mt-5 grid grid-cols-2 gap-3"><div className="rounded-lg bg-navy p-3"><div className="flex items-center gap-1 text-xs text-white/60"><I n="camera" s={14}/>Camera frame</div><div className="mt-2 h-20 rounded bg-navy2 border border-dashed border-amber/60 grid place-items-center text-xs text-amber">Stockpile uncovered</div></div>
<div className="rounded-lg bg-navy p-3"><div className="text-xs text-white/60">PM spike</div><svg viewBox="0 0 120 60" className="mt-2 w-full h-20"><polyline className="spike" points="0,48 20,46 40,47 55,40 65,10 78,34 95,44 120,45" fill="none" stroke="#E8A23A" strokeWidth="2.5"/></svg></div></div>
<div className="mt-3 rounded-lg border border-crit/50 bg-crit/10 p-3"><div className="flex justify-between items-center"><span className="text-sm font-semibold flex gap-2 items-center"><I n="bell" s={16}/>Evidence-based alert</span><Chip lv="c">CRITICAL</Chip></div><p className="text-sm text-white/75 mt-1">Sensor + camera signals agree. Recommended response: cover stockpile, increase watering.</p></div>
<p className="text-white/70 mt-4 text-sm">When multiple signals indicate a problem, the manager receives an evidence-based alert through the dashboard and Zalo with a recommended response.</p></div></R></div></Sec>

<Sec id="loop"><H t="The Learning Loop"/><R><Flow desc/></R></Sec>

<Sec dark c="!pt-0"><H dark t="Built on an Enterprise AI Ecosystem"/>
<div className="grid md:grid-cols-2 gap-6"><R><div className="rounded-xl border border-white/15 p-6 h-full"><h3 className="font-display font-bold text-xl text-mint">FPT Technology Backbone</h3><ul className="mt-4 space-y-2 text-white/80">{['FPT Camera AI','FPT AI Vision / VLM','FPT AI Read','FPT AI Agents','FPT AI Chat with Zalo','FPT AI Factory','FPT Cloud'].map(x=><li key={x} className="flex gap-2"><I n="layers" c="text-mint/70" s={18}/>{x}</li>)}</ul></div></R>
<R d={100}><div className="rounded-xl border border-mint/40 bg-mint/5 p-6 h-full"><h3 className="font-display font-bold text-xl text-mint">PreventAir Intelligence Layer</h3><ul className="mt-4 space-y-2 text-white/80">{['Dust-risk prediction model','Construction-specific computer-vision compliance model','Dust-source attribution engine','Compliance scoring engine','Alert and recommendation engine','Regulatory knowledge base'].map(x=><li key={x} className="flex gap-2"><I n="check" c="text-mint" s={18}/>{x}</li>)}</ul></div></R></div>
<p className="mt-8 font-display text-xl font-bold">FPT provides the technology backbone. PreventAir AI develops the pollution-specific intelligence layer.</p></Sec>

<Sec><H t="Illustrative Dashboard" tag="Illustrative Product Concept" s="A concept mockup. Values shown are illustrative and are not real field results."/>
<R><div className="rounded-2xl bg-navy text-white p-4 sm:p-6 shadow-xl">
<div className="flex flex-wrap items-center justify-between gap-2 pb-4 border-b border-white/10"><div><div className="text-xs text-white/60">Site</div><div className="font-semibold">Hanoi Construction Site — Demo</div></div><Tag dark>Illustrative Product Concept</Tag></div>
<div className="grid lg:grid-cols-3 gap-4 mt-4">
<div className="lg:col-span-2 rounded-xl border border-crit/50 bg-crit/10 p-5"><div className="flex justify-between items-center"><span className="text-sm text-white/70">Overall Dust Risk</span><Chip lv="c">HIGH</Chip></div><div className="font-display font-extrabold text-4xl mt-2">HIGH</div><p className="mt-1 text-white/80">Predicted high-risk window: <b>14:00–16:00</b></p>
<div className="flex flex-wrap gap-2 mt-3">{['Strong wind','Excavation activity','Dry surface conditions'].map(x=><span key={x} className="text-xs px-2 py-1 rounded bg-white/10">{x}</span>)}</div>
<p className="mt-4 text-sm"><b className="text-amber">Recommended action:</b> Reschedule excavation or strengthen dust controls.</p></div>
<div className="grid grid-cols-2 gap-3">{[['PM2.5','62 µg/m³','w'],['PM10','118 µg/m³','w'],['Wind','NE · strong','w'],['Camera','Online','n']].map(([a,b,l])=><div key={a} className="rounded-lg bg-white/5 p-3"><div className="text-xs text-white/60">{a}</div><div className="font-semibold text-sm mt-1">{b}</div><div className="mt-1"><Chip lv={l}>{l==='n'?'Normal':'Warning'}</Chip></div></div>)}</div></div>
<div className="grid md:grid-cols-3 gap-4 mt-4 text-sm">
<div className="rounded-lg bg-white/5 p-4"><div className="font-semibold mb-2">Compliance status</div><div className="flex justify-between"><span className="text-white/70">Stockpile cover</span><Chip lv="c">Missing</Chip></div><div className="flex justify-between mt-1"><span className="text-white/70">Wheel wash</span><Chip lv="n">OK</Chip></div></div>
<div className="rounded-lg bg-white/5 p-4"><div className="font-semibold mb-2">Activity schedule</div>{[['Excavation','14:00–16:00','c'],['Concrete pour','09:00–11:00','n']].map(([a,b,l])=><div key={a} className="flex justify-between mt-1"><span className="text-white/70">{a}</span><span className={l==='c'?'text-amber':'text-mint'}>{b}</span></div>)}</div>
<div className="rounded-lg bg-white/5 p-4"><div className="font-semibold mb-2">Incident history</div><p className="text-white/60">No real incidents recorded. Records will appear here with timestamps, responses and outcomes.</p></div></div></div></R></Sec>

<Sec c="!pt-0"><H t="Key Features"/><div className="grid sm:grid-cols-2 lg:grid-cols-4 gap-5">{feats.map(([ic,t,d],i)=><R key={t} d={(i%4)*70}><div className="cd rounded-xl p-5 h-full hover:border-teal transition-colors"><div className="w-10 h-10 rounded-lg bg-teal/10 text-teal grid place-items-center"><I n={ic}/></div><h3 className="font-display font-bold mt-3">{t}</h3><p className="text-sm mut mt-1.5">{d}</p></div></R>)}</div></Sec>

<Sec dark><H dark t="Designed for Measurable ESG Impact" tag="Expected outcomes"/>
<div className="grid md:grid-cols-3 gap-5">{[['Environmental','border-mint text-mint',['Reduce dust emissions at the source','Prevent or mitigate high-risk events earlier','Improve targeting of dust-control measures','Support Hanoi’s broader air-quality objectives']],['Social','border-amber text-amber',['Reduce dust exposure for nearby residents','Protect students, commuters and workers','Reduce community complaints and friction','Strengthen trust between projects and surrounding communities']],['Governance','border-white/60 text-white',['Timestamp incidents and corrective actions','Create transparent compliance records','Link alerts to regulatory requirements','Support risk-based inspection while keeping authorities responsible for legal verification and enforcement']]].map(([t,c,l],i)=><R key={t} d={i*100}><div className={`rounded-xl border-t-4 bg-white/5 p-6 h-full ${c.split(' ')[0]}`}><h3 className={`font-display font-bold text-xl ${c.split(' ')[1]}`}>{t}</h3><ul className="mt-4 space-y-3 text-white/80 text-sm">{l.map(x=><li key={x} className="flex gap-2"><I n="check" c="shrink-0 mt-0.5 opacity-70" s={16}/>{x}</li>)}</ul></div></R>)}</div></Sec>

<Sec><H t="How We Will Measure Success" s="These are measurement metrics, not achieved performance results." tag="Planned measurement"/>
<div className="grid sm:grid-cols-2 lg:grid-cols-3 gap-5">{mets.map(([t,d,ic],i)=><R key={t} d={(i%3)*70}><div className="cd rounded-xl p-5 h-full"><div className="flex justify-between items-center"><I n={ic} c="text-teal"/><span className="text-xs mut border ln rounded px-1.5 py-0.5">Value: to be measured</span></div><h3 className="font-display font-bold mt-3">{t}</h3><p className="text-sm mut mt-1">{d}</p></div></R>)}</div></Sec>

<Sec c="!pt-0"><H t="Implementation Roadmap" tag="Planned pilot"/>
<div className="grid md:grid-cols-3 gap-5 relative">{[['Stage 01','MVP',['Evidence-based dust-risk score','PM sensor monitoring','Camera verification','Dashboard and Zalo alerts','Incident records']],['Stage 02','Pilot',['Deploy at approximately 20 pilot sites','Compare predictions with actual events','Calibrate weights and thresholds','Build a labelled Hanoi construction dataset']],['Stage 03','Scale',['Progress toward machine-learning prediction','Expand across contractors and sites','Scale production infrastructure on FPT Cloud']]].map(([s,t,l],i)=><R key={s} d={i*100}><div className="cd rounded-xl p-6 h-full"><div className="flex items-center gap-3"><span className="w-9 h-9 rounded-full bg-teal text-white grid place-items-center font-bold">{i+1}</span><div><div className="text-xs mut">{s}</div><h3 className="font-display font-bold text-xl leading-none">{t}</h3></div></div><ul className="mt-4 space-y-2 text-sm mut">{l.map(x=><li key={x} className="flex gap-2"><I n="check" c="text-teal shrink-0 mt-0.5" s={16}/>{x}</li>)}</ul></div></R>)}</div>

/* ===== Page: Contact ===== */
function Field({l,err,children}){return <label className="block"><span className="text-sm font-semibold">{l}</span>{children}{err&&<span role="alert" className="block text-sm text-crit mt-1">{err}</span>}</label>}
function Contact(){
const E={name:'',company:'',role:'',email:'',phone:'',interest:'',message:''};
const[v,setV]=useState(E);const[er,setEr]=useState({});const[ok,setOk]=useState(false);
const set=k=>e=>setV({...v,[k]:e.target.value});
const inp="mt-1 w-full rounded-lg border ln bg-transparent px-3 py-2.5 focus:border-teal";
const submit=e=>{e.preventDefault();const x={};
if(!v.name.trim())x.name='Enter your full name.';if(!v.company.trim())x.company='Enter your company or organisation.';if(!v.role.trim())x.role='Enter your role.';
if(!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(v.email))x.email='Enter a valid email address, e.g. name@company.com.';
if(v.phone&&!/^[+\d][\d\s().-]{7,}$/.test(v.phone))x.phone='Enter a valid phone number or leave this blank.';
if(!v.interest)x.interest='Choose what you are interested in.';if(v.message.trim().length<10)x.message='Write at least 10 characters.';
setEr(x);if(!Object.keys(x).length){setOk(true);setV(E)}};
return <>
<PageHero t="Let’s Build Cleaner Construction Together" s="We welcome conversations with construction contractors, technology partners and organisations interested in environmental monitoring and responsible urban development."/>
<Sec><div className="grid lg:grid-cols-3 gap-8">
<form onSubmit={submit} noValidate className="lg:col-span-2 cd rounded-2xl p-6 sm:p-8 space-y-4">
{ok&&<div role="status" className="rounded-lg border border-emerald-500/40 bg-emerald-500/10 p-4"><b>Demo only — your message was not sent.</b><p className="text-sm mut mt-1">This website has no backend yet. Connect the form to your email or form service to receive messages.</p></div>}
<div className="grid sm:grid-cols-2 gap-4"><Field l="Full Name" err={er.name}><input className={inp} value={v.name} onChange={set('name')} autoComplete="name"/></Field><Field l="Company / Organisation" err={er.company}><input className={inp} value={v.company} onChange={set('company')} autoComplete="organization"/></Field>
<Field l="Role" err={er.role}><input className={inp} value={v.role} onChange={set('role')}/></Field><Field l="Email" err={er.email}><input type="email" className={inp} value={v.email} onChange={set('email')} autoComplete="email"/></Field>
<Field l="Phone Number (optional)" err={er.phone}><input type="tel" className={inp} value={v.phone} onChange={set('phone')} autoComplete="tel"/></Field>
<Field l="I’m interested in:" err={er.interest}><select className={inp} value={v.interest} onChange={set('interest')}><option value="" className="text-black">Select an option</option>{['Pilot Programme','Technology Partnership','Research / Collaboration','Other'].map(o=><option key={o} className="text-black">{o}</option>)}</select></Field></div>
<Field l="Message" err={er.message}><textarea rows="5" className={inp} value={v.message} onChange={set('message')}/></Field>
<button type="submit" className="inline-flex items-center gap-2 px-6 py-3 rounded-lg font-semibold bg-navy text-white hover:bg-teal transition"><I n="send" s={16}/>Send Message</button></form>
<aside className="space-y-4">{[['mail','Email',CONTACT.email],['link','LinkedIn',CONTACT.linkedin],['link','Facebook',CONTACT.facebook],['pin','Location',CONTACT.location]].map(([ic,l,t])=><div key={l} className="cd rounded-xl p-5 flex gap-3"><I n={ic} c="text-teal shrink-0 mt-0.5"/><div><div className="text-sm mut">{l}</div><div className="font-semibold break-all">{t}</div></div></div>)}<p className="text-xs mut">Placeholders: replace the values in the CONTACT object at the top of the script.</p></aside></div></Sec></>}

/* ===== Layout ===== */
function Nav({page}){const[o,setO]=useState(false);const links=Object.keys(slug);
return <header className="sticky top-0 z-50 bg-navy/90 backdrop-blur border-b border-white/10 text-white" style={{paddingTop:'env(safe-area-inset-top,0px)'}}>
<Wrap c="h-16 flex items-center justify-between"><a href="#/home" className="flex items-center gap-2 font-display font-extrabold text-xl"><I n="wind" c="text-mint" s={24}/>PreventAir AI</a>
<nav className="hidden md:flex items-center gap-7" aria-label="Main">{links.map(l=><a key={l} href={'#/'+slug[l]} aria-current={page===slug[l]?'page':undefined} className={`text-sm font-medium pb-1 border-b-2 transition ${page===slug[l]?'border-mint text-white':'border-transparent text-white/70 hover:text-white'}`}>{l}</a>)}<a href="#/solution" className="px-4 py-2 rounded-lg bg-mint text-navy text-sm font-semibold hover:bg-white transition">Explore Our Solution</a></nav>
<button className="md:hidden p-2" aria-label="Toggle menu" aria-expanded={o} onClick={()=>setO(!o)}><I n={o?'x':'menu'} s={26}/></button></Wrap>
{o&&<nav className="md:hidden border-t border-white/10 px-5 pb-4" aria-label="Mobile">{links.map(l=><a key={l} href={'#/'+slug[l]} onClick={()=>setO(false)} className="block py-3 text-white/90 border-b border-white/5">{l}</a>)}<a href="#/solution" onClick={()=>setO(false)} className="block mt-3 text-center px-4 py-3 rounded-lg bg-mint text-navy font-semibold">Explore Our Solution</a></nav>}</header>}
function Footer(){return <footer className="bg-navy text-white py-12"><Wrap><div className="grid md:grid-cols-3 gap-8"><div><div className="flex items-center gap-2 font-display font-extrabold text-xl"><I n="wind" c="text-mint" s={22}/>PreventAir AI</div><p className="mt-2 text-mint">Predict Dust. Prevent Pollution.</p><p className="mt-2 text-sm text-white/60">AI-powered environmental intelligence for cleaner construction in Hanoi.</p></div>
<nav aria-label="Footer" className="flex flex-col gap-2 text-white/80">{Object.keys(slug).map(l=><a key={l} href={'#/'+slug[l]} className="hover:text-mint">{l}</a>)}</nav>
<div className="flex gap-3 md:justify-end items-start">{['LinkedIn','Facebook'].map(s=><a key={s} href="#/contact" aria-label={`${s} (placeholder link)`} title={`${s}: ${CONTACT[s.toLowerCase()]}`} className="w-10 h-10 rounded-full border border-white/25 grid place-items-center hover:bg-white/10"><I n="link" s={18}/></a>)}</div></div>
<p className="mt-10 pt-6 border-t border-white/10 text-sm text-white/50">© 2026 PreventAir AI. All rights reserved.</p></Wrap></footer>}

function App(){
const get=()=>{try{const h=location.hash.replace('#/','');return slug[Object.keys(slug).find(k=>slug[k]===h)]?h:'home'}catch(e){return 'home'}};
const[page,setPage]=useState(get());
useEffect(()=>{const f=()=>{setPage(get());window.scrollTo({top:0})};addEventListener('hashchange',f);return()=>removeEventListener('hashchange',f)},[]);
const P={home:Home,about:About,solution:Solution,contact:Contact}[page];
return <><a href="#main" onClick={e=>{e.preventDefault();document.getElementById('main').focus()}} className="sr-only focus:not-sr-only focus:absolute focus:z-[60] focus:bg-white focus:text-black focus:p-3">Skip to content</a>
<Nav page={page}/><main id="main" tabIndex="-1" key={page} className="fade outline-none"><P/></main><Footer/></>}
ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
